<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Grammar Challenge</title>
<style>
:root{--b:#1f4fd8;--bd:#13338f;--p:#6d3fd0;--y:#ffc93c;--g:#1fa971;--r:#e8544a;--bg:#eef3ff;--t:#1a2250}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--t);background:linear-gradient(160deg,#1f4fd8,#6d3fd0);min-height:100vh;display:flex;justify-content:center;padding:14px}
#app{width:100%;max-width:880px}.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.15);position:relative}
h1{margin:0;font-size:clamp(28px,6vw,46px);color:var(--bd);letter-spacing:.5px}h2{margin:.2em 0}.sub{display:inline-block;background:var(--y);color:var(--bd);font-weight:800;padding:6px 16px;border-radius:30px;margin:10px 0}
.hero{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}.hero img{height:170px;border-radius:18px}.imgs{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.imgs img{height:90px;border-radius:14px}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:18px;padding:14px 24px;cursor:pointer;background:var(--b);color:#fff;box-shadow:0 5px 0 var(--bd);transition:transform .1s;margin:6px;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd)}.btn.y{background:var(--y);color:var(--bd);box-shadow:0 5px 0 #c99500}.btn.p{background:var(--p);box-shadow:0 5px 0 #43228f}.btn.s{font-size:14px;padding:8px 14px}
input.name,input.fill{font:inherit;font-size:20px;padding:12px 16px;border:3px solid #c9d6ff;border-radius:16px;width:min(320px,90%);text-align:center}
.bar{height:14px;background:#dfe7ff;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--p));transition:width .4s}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-weight:800}.pill{background:var(--bg);border-radius:20px;padding:6px 14px}.timer{background:var(--b);color:#fff}.timer.low{background:var(--r);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}.q{font-size:clamp(19px,3.4vw,26px);font-weight:800;margin:18px 0;line-height:1.35}.tag{color:var(--p);font-size:14px;font-weight:800}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:19px;font-weight:700;background:var(--bg);color:var(--t);border:3px solid #c9d6ff;border-radius:16px;padding:14px 18px;margin:9px 0;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--p)}.opt.ok{background:#d6f5e6;border-color:var(--g)}.opt.no{background:#ffe1de;border-color:var(--r)}
.row{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:16px}.ans{background:var(--bg);border:3px dashed #9db3ff}.w{font:inherit;font-weight:800;font-size:18px;background:#fff;border:3px solid var(--p);color:var(--p);border-radius:12px;padding:8px 12px;cursor:pointer}.w:disabled{opacity:.4}
.fb{margin-top:14px;padding:16px;border-radius:18px;animation:pop .3s}.fb.ok{background:#d6f5e6;color:#0b6b43}.fb.no{background:#ffe9d6;color:#9a4300}@keyframes pop{from{transform:scale(.9);opacity:0}}.fb b.big{font-size:24px}
.fly{position:fixed;font-weight:900;font-size:34px;color:var(--g);pointer-events:none;animation:fly 1s forwards;z-index:9}@keyframes fly{to{transform:translateY(-90px);opacity:0}}
.conf{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
.ov{position:absolute;inset:0;background:rgba(255,255,255,.95);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
.chart{display:flex;gap:10px;align-items:flex-end;height:150px;margin:14px 0}.chart div{flex:1;text-align:center;font-size:13px;font-weight:800}.chart i{display:block;background:linear-gradient(var(--p),var(--b));border-radius:10px 10px 0 0;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stats div{background:var(--bg);border-radius:16px;padding:12px;text-align:center}.stats b{display:block;font-size:26px;color:var(--bd)}
.rv{border-left:8px solid var(--g);background:var(--bg);border-radius:12px;padding:10px 14px;margin:10px 0}.rv.x{border-color:var(--r)}.hide{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>

const D=[
["m","Which sentence is a simple sentence?",["Minh plays basketball.","Nam was tired, but he finished the project.","Mai felt tired, so she took a short break.","You can talk to your teacher, or you can ask a friend for help."],0,"A simple sentence has exactly one independent clause. The other three have two."],
["t","A simple sentence contains exactly one independent clause.",true,"Simple sentence = 1 independent clause (one complete idea)."],
["s","Lan reads books and listens to music.","simple","One subject (Lan) with two verbs joined by 'and' = one independent clause, so it is simple."],
["m","How many independent clauses are in: 'I joined the art club, and my friend joined the music club.'?",["1","3","2","0"],2,"'I joined the art club' and 'my friend joined the music club' are two independent clauses."],
["t","A sentence with the word 'and' is always a compound sentence.",false,"Not always. 'Lan reads books and listens to music' is simple because there is only one subject-verb clause."],
["m","What is the verb in: 'Peer pressure is stressful.'?",["Peer","pressure","is","stressful"],2,"'is' is the linking verb. 'Peer pressure' is the subject."],
["m","'Minh and Nam play basketball.' is…",["a fragment","a compound sentence","a simple sentence with a compound verb","a simple sentence with a compound subject"],3,"Two subjects share one verb, so it is still one independent clause: a simple sentence."],
["s","Teens need good friends and tolerant teachers.","simple","'good friends and tolerant teachers' is a compound object. There is only one clause."],
["m","Which structure is 'Peer pressure is stressful.'?",["S + V","S + V + O","S + be/linking verb + complement","There + be + noun"],2,"is = linking verb, stressful = complement."],
["e","There is many clubs at our school.",1,"There are many clubs at our school.","'clubs' is plural, so we need 'There are'."],
["m","Which sentence is correct?",["My best friend is very kind.","My best friend be very kind.","My best friend very kind.","Best friend my is very kind."],0,"A simple sentence needs a verb: My best friend is very kind."],
["o","Minh/does/his/homework/after/dinner.","Structure S + V + O + adverbial: Minh (S) does (V) his homework (O) after dinner (adverbial)."],
["f","Mai felt tired, ___ she took a short break.","so","'so' shows a result."],
["f","Nam was tired, ___ he finished the project.","but","'but' shows contrast."],
["f","You can talk to your teacher, ___ you can ask a friend for help.","or","'or' shows a choice."],
["f","Lan stayed at home, ___ she was feeling unwell.","for","'for' gives a reason (like 'because')."],
["m","Which conjunction shows a result?",["FOR","BUT","SO","OR"],2,"SO = result. FOR = reason, BUT = contrast, OR = choice."],
["m","Which conjunction shows contrast (opposite ideas)?",["AND","OR","SO","BUT"],3,"BUT shows contrast."],
["o","I/joined/the/art/club,/and/my/friend/joined/the/music/club.","Independent clause + , and + independent clause."],
["m","Which sentence is punctuated correctly?",["I wanted to join the trip but I had an important test.","I wanted to join the trip but, I had an important test.","I wanted to join, the trip but I had an important test.","I wanted to join the trip, but I had an important test."],3,"Put a comma before 'but' when it joins two independent clauses."],
["e","Lan reads books, and listens to podcasts.",2,"Lan reads books and listens to podcasts.","Both verbs share one subject, so it is a simple sentence: no comma before 'and'."],
["m","Which is the best way to combine: 'Mai was hungry. She made a sandwich.'?",["Mai was hungry, so she made a sandwich.","Mai was hungry, but she made a sandwich.","Mai was hungry so, she made a sandwich.","Mai was hungry or she made a sandwich."],0,"Being hungry led to making a sandwich: a result, so use ', so'."],
["t","'Nam was tired but he finished the project.' needs a comma before 'but'.",true,"It joins two independent clauses: Nam was tired, but he finished the project."],
["o","My/parents/listened/to/me,/and/they/gave/me/useful/advice.","Two independent clauses joined by ', and'."],
["s","Many teenagers use social media every day.","simple","One subject (Many teenagers), one verb (use): simple."],
["s","My parents listened to me, and they gave me useful advice.","compound","Two independent clauses, each with its own subject and verb, joined by ', and'."],
["m","'Lan and Mai study together after school.' is…",["a compound sentence because there are two subjects","a compound sentence because it has 'and'","a simple sentence with a compound subject","a fragment"],2,"One verb (study) and one clause: simple sentence."],
["m","Which is a compound sentence?",["You should manage your time well, or you may miss deadlines.","Lan reads books and listens to music.","Teens need good friends and tolerant teachers.","Minh and Nam play basketball."],0,"Only this one has two independent clauses joined by ', or'."],
["f","I was tired, ___ I went to bed early.","so","Being tired leads to going to bed early: result = so."],
["m","Complete: 'You should study tonight, ___ you may fail the test.'",["and","so","for","or"],3,"'or' offers a choice/warning: study, or you may fail."]
];
const $=s=>document.querySelector(s),app=$("#app");
let S;const N=D.length,MAX=N*PTS+(N/PER)*BON;
function snd(ok){if(!S||!S.snd)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();(ok?[523,659,784]:[300,220]).forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type=ok?"triangle":"sine";g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.13);o.stop(c.currentTime+i*.13+.12)})}catch(e){}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function intro(){const nm=S&&S.name||"";S={snd:S?S.snd:true,name:nm};
app.innerHTML=`<div class="card"><div class="hero"><img src="${IMG.boy}" alt=""><div><h1>ENGLISH GRAMMAR CHALLENGE</h1><div class="sub">SIMPLE SENTENCES &amp; COMPOUND SENTENCES</div><h2>📚 ${N} QUESTIONS · ${N/PER} ROUNDS ✏️</h2></div><img src="${IMG.kids}" alt=""></div>
<div class="imgs"><img src="${IMG.books}" alt=""><img src="${IMG.openbook}" alt=""><img src="${IMG.bag}" alt=""></div>
<p style="text-align:center"><input class="name" id="nm" maxlength="24" placeholder="Your name" value="${nm}"></p>
<p style="text-align:center"><button class="btn y" id="go">▶ START GAME</button><button class="btn p" id="how">❓ HOW TO PLAY</button></p></div>`;
$("#go").onclick=start;$("#how").onclick=()=>alert("• Answer "+N+" questions in "+N/PER+" rounds.\n• 30 seconds per question.\n• Correct = +10 points. Finish a round = +20 bonus.\n• One try per question. Use ⏸ to pause.\n• Question types: multiple choice, true/false, fill in the blank, word ordering, sorting, error spotting.")}
function start(){S.name=($("#nm").value||"").trim()||"Player";S.i=0;S.score=0;S.a=[];S.t0=Date.now();S.snd=S.snd!==false;show()}
function show(){const q=D[S.i],ty=q[0];S.lock=false;S.left=30;S.pause=false;
app.innerHTML=`<div class="card" id="cd"><div class="top"><span class="pill">Round ${S.i/PER|0+0?(S.i/PER|0)+1:1}: ${ROUNDS[S.i/PER|0]}</span><span class="pill">⭐ <span id="sc">${S.score}</span></span><span class="pill timer" id="tm">⏱ 30</span><button class="btn s p" id="ps">⏸</button><button class="btn s" id="sn">${S.snd?"🔊":"🔇"}</button></div>
<div class="bar"><i style="width:${S.i/N*100}%"></i></div><div class="tag" style="margin-top:8px">Question ${S.i+1}/${N}</div><div id="bd"></div><div id="fb"></div></div>`;
$("#ps").onclick=pause;$("#sn").onclick=e=>{S.snd=!S.snd;e.target.textContent=S.snd?"🔊":"🔇"};render(q);
clearInterval(S.iv);S.iv=setInterval(()=>{if(S.pause||S.lock)return;S.left--;const t=$("#tm");t.textContent="⏱ "+S.left;t.classList.toggle("low",S.left<=5);if(S.left<=0)done(null,"(no answer)",true)},1000)}
function pause(){if(S.lock)return;S.pause=true;const o=document.createElement("div");o.className="ov";o.innerHTML='<h1>⏸ PAUSED</h1><button class="btn y">▶ RESUME</button>';o.querySelector("button").onclick=()=>{o.remove();S.pause=false};$("#cd").append(o)}
function ca(q){const t=q[0];return t=="m"?q[2][q[3]]:t=="t"?(q[2]?"True":"False"):t=="f"?q[1].replace("___",q[2]):t=="o"?q[1].split("/").join(" "):t=="s"?(q[2]=="simple"?"Simple sentence":"Compound sentence"):q[3]}
function render(q){const b=$("#bd"),t=q[0];
if(t=="m"){b.innerHTML=`<div class="q">${q[1]}</div>`+q[2].map((o,i)=>`<button class="opt" data-i="${i}">${"ABCD"[i]}. ${o}</button>`).join("");b.querySelectorAll(".opt").forEach(x=>x.onclick=()=>done(+x.dataset.i==q[3],q[2][x.dataset.i]))}
else if(t=="t"){b.innerHTML=`<div class="q">True or False?<br>${q[1]}</div><button class="opt" data-v="1">✅ True</button><button class="opt" data-v="0">❌ False</button>`;b.querySelectorAll(".opt").forEach(x=>x.onclick=()=>done((x.dataset.v=="1")==q[2],x.dataset.v=="1"?"True":"False"))}
else if(t=="s"){b.innerHTML=`<div class="q">Sort this sentence:<br>“${q[1]}”</div><button class="opt" data-v="simple">🟦 Simple sentence</button><button class="opt" data-v="compound">🟪 Compound sentence</button>`;b.querySelectorAll(".opt").forEach(x=>x.onclick=()=>done(x.dataset.v==q[2],x.dataset.v=="simple"?"Simple sentence":"Compound sentence"))}
else if(t=="f"){b.innerHTML=`<div class="q">Fill in the blank (for / and / nor / but / or / yet / so):<br>${q[1].replace("___","<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</div><input class="fill" id="fi" autocomplete="off" placeholder="type here"> <button class="btn" id="ck">Check</button>`;const go=()=>{const v=$("#fi").value.trim().toLowerCase();if(v)done(v==q[2],v)};$("#ck").onclick=go;$("#fi").onkeydown=e=>{if(e.key=="Enter")go()}}
else if(t=="o"){const ws=q[1].split("/");let pick=[];b.innerHTML=`<div class="q">Tap the words in the correct order.</div><div class="row ans" id="an"></div><div class="row" id="bk"></div><button class="btn" id="ck">Check</button>`;
const draw=()=>{$("#an").innerHTML=pick.map(i=>`<button class="w" data-r="${i}">${ws[i]}</button>`).join("");$("#bk").innerHTML=S.bank.map(i=>`<button class="w" data-a="${i}" ${pick.includes(i)?"disabled":""}>${ws[i]}</button>`).join("");$("#an").querySelectorAll("button").forEach(x=>x.onclick=()=>{if(S.lock)return;pick=pick.filter(p=>p!=x.dataset.r);draw()});$("#bk").querySelectorAll("button").forEach(x=>x.onclick=()=>{if(S.lock)return;pick.push(+x.dataset.a);draw()})};
S.bank=shuf(ws.map((_,i)=>i));draw();$("#ck").onclick=()=>{if(!pick.length)return;const u=pick.map(i=>ws[i]).join(" ");done(u==ws.join(" "),u)}}
else if(t=="e"){const ws=q[1].split(" ");b.innerHTML=`<div class="q">Find the mistake. Tap the wrong word.</div><div class="row">${ws.map((w,i)=>`<button class="w" data-i="${i}">${w}</button>`).join("")}</div>`;b.querySelectorAll(".w").forEach(x=>x.onclick=()=>done(+x.dataset.i==q[2],"Tapped: “"+ws[x.dataset.i]+"”"))}}
function done(ok,user,to){if(S.lock)return;S.lock=true;clearInterval(S.iv);const q=D[S.i],last=(S.i+1)%PER==0;
let res=to?"t":ok?"c":"w";if(res=="c")S.score+=PTS;if(last)S.score+=BON;S.a[S.i]={res,user};

if(q[0]=="m")$("#bd").querySelectorAll(".opt").forEach(x=>{if(+x.dataset.i==q[3])x.classList.add("ok");else if(res=="w"&&x.textContent.includes(user)&&x.textContent.slice(3)==user)x.classList.add("no")});
const ex=q[q.length-1];$("#sc").textContent=S.score;
$("#fb").innerHTML=`<div class="fb ${res=="c"?"ok":"no"}"><b class="big">${res=="c"?"🌟 GREAT JOB!":res=="t"?"⏰ TIME'S UP!":"💪 TRY AGAIN!"}</b>${res=="c"?" +"+PTS:""}${last?" · 🏅 Round bonus +"+BON:""}<br>${res=="c"?"":"<b>Correct answer:</b> "+ca(q)+"<br>"}${ex}</div><p style="text-align:center"><button class="btn y" id="nx">${S.i+1<N?"NEXT ➜":"SEE RESULTS 🏆"}</button></p>`;
$("#nx").onclick=()=>{S.i++;S.i<N?show():end()};snd(res=="c");
if(res=="c"){const f=document.createElement("div");f.className="fly";f.textContent="+10";f.style.left="45%";f.style.top="30%";document.body.append(f);setTimeout(()=>f.remove(),1000);for(let k=0;k<14;k++){const c=document.createElement("div");c.className="conf";c.textContent=["⭐","🎉","✨"][k%3];c.style.left=Math.random()*95+"%";c.style.animationDelay=Math.random()*.4+"s";document.body.append(c);setTimeout(()=>c.remove(),2200)}}}
function rank(s){const r=s/MAX;return r>=900/1100?["GRAMMAR LEGEND","👑"]:r>=750/1100?["GRAMMAR MASTER","🏆"]:r>=500/1100?["GRAMMAR STAR","⭐"]:r>=300/1100?["GRAMMAR HERO","🦸"]:["KEEP PRACTISING","📘"]}
function end(){clearInterval(S.iv);const c=S.a.filter(a=>a.res=="c").length,w=S.a.filter(a=>a.res=="w").length,t=S.a.filter(a=>a.res=="t").length,tm=Math.round((Date.now()-S.t0)/1000),[rk,ic]=rank(S.score),pc=Math.round(c/N*100);
const rc=ROUNDS.map((_,r)=>S.a.slice(r*PER,r*PER+PER).filter(a=>a.res=="c").length);
app.innerHTML=`<div class="card"><div style="text-align:center"><div style="font-size:70px">${ic}</div><h1>${rk}</h1><h2>${S.name}</h2><p>${pc>=80?"Fantastic! You really know your sentences.":pc>=50?"Nice work! A little more practice and you will be a master.":"Good effort! Review the answers and try again. You can do it!"}</p></div>
<div class="stats"><div><b>${N}</b>Questions</div><div><b>${c}</b>Correct</div><div><b>${w}</b>Wrong</div><div><b>${t}</b>Unanswered</div><div><b>${S.score}/${MAX}</b>Score</div><div><b>${pc}%</b>Accuracy</div><div><b>${Math.floor(tm/60)}:${String(tm%60).padStart(2,"0")}</b>Time</div></div>
<div id="rs" class="hide"><div class="chart">${rc.map((v,i)=>`<div><i style="height:${v/PER*110}px"></i>R${i+1}: ${v}/${PER}</div>`).join("")}</div></div>
<p style="text-align:center"><button class="btn y" id="pa">🔁 PLAY AGAIN</button><button class="btn" id="rv">📖 REVIEW ANSWERS</button><button class="btn p" id="sr">📊 SHOW RESULTS</button></p><div id="rl"></div></div>`;
$("#pa").onclick=()=>{intro()};$("#sr").onclick=()=>$("#rs").classList.toggle("hide");
$("#rv").onclick=()=>{$("#rl").innerHTML=D.map((q,i)=>{const a=S.a[i],qt=q[0]=="o"?"Order: "+q[1].split("/").join(" / "):q[1];return`<div class="rv ${a.res=="c"?"":"x"}"><b>${i+1}. ${qt}</b><br>Your answer: ${a.user}<br>Correct: ${ca(q)}<br><i>${q[q.length-1]}</i></div>`}).join("")}}
intro();
</script></body></html>
